name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional repository secrets; publishing steps are skipped when unset.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Drive the runner's preinstalled Google Chrome (no browser download).
      - name: Install Playwright
        timeout-minutes: 3
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm i --no-save playwright@1.56.0 && google-chrome --version

      - name: Build
        run: npm run build

      - name: "Browser test: annotate and save"
        env: { PW_CHANNEL: chrome }
        timeout-minutes: 3
        run: npm run build:testlib && node test/browser/webview.test.mjs

      - name: "Browser test: re-applied annotations"
        env: { PW_CHANNEL: chrome }
        timeout-minutes: 3
        run: node test/browser/merged.test.mjs

      - name: "Browser test: sidebar"
        env: { PW_CHANNEL: chrome }
        timeout-minutes: 3
        run: node test/browser/sidebar.test.mjs

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }

      - name: Package .vsix
        run: npx vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"

      # Optional: add these repository secrets to publish automatically.
      #   VSCE_PAT  - VS Code Marketplace token (publisher "gzheng92")
      #   OVSX_PAT  - Open VSX token (for VSCodium / Cursor)
      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath *.vsix

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && env.OVSX_PAT != ''
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
